# 基础信息
metadata:
  date: 2026-02-27
  recipe_name: "Cold IPA"
  batch_id: "20260227-C-IPA"

# 统计单位说明 (保持单位一致性)
units:
  weight: "kg"
  volume: "L"
  temperature: "C"
  gravity: "SG"

# 原料设置 (支持多种麦芽)
ingredients:
  malts:
    - name: "Pilsen Malt"
      supplier: "Briess"
      amount: 6
      potential_extract: 0.81
    - name: "Flaked Rice"
      supplier: "NULL"
      amount: 1.5
      potential_extract: 0.81
  total_malt_weight: 7.5
  potential_extract: 0.78

# 糖化过程
mash:
  strike_water: 23
  water_grain_ratio: 3.06  # 水料比
  target_temperature: 64
  sparge_water: 7
  
  # 糖化期间的定时采样数据
  process_logs:
    - time_min: 0
      ph: 5.15
      gravity: 1.037
    - time_min: 20
      ph: 5.29
      gravity: 1.069
    - time_min: 40
      ph: 5.24
      gravity: 1.083

# 关键环节测量
measurements:
  # 洗糟前（头道麦汁采集前，糖化结束时）
  pre_sparge:
    volume: 15
    gravity: 1.084
    
  # 熬煮前（收集完洗糟水后的总麦汁体积）
  pre_boil:
    volume: 26
    gravity: 1.067
    
  # 熬煮后（入发酵罐前）
  post_boil:
    volume: 24
    gravity: 1.075
    
  # 发酵结束
  final:
    volume: 
    gravity: 1.008