fermentation:
  yeast:
    - strain: "SafAle S-33"
      type: "干酵母"
      amount: "1包"
      timing: "热接种20°C时同时投入"
    - strain: "SafAle BE-134"
      type: "干酵母"
      amount: "1包"
      timing: "热接种20°C时同时投入"
  clarification: "不使用澄清剂，保留古老谷物蛋白质以维系泡沫，留存悬浮活酵母用于二发"
  primary:
    temp_pitch: 20
    temp_free_rise: "25~28"
    back_pressure: "前2天零背压(粗排气管或盖铝箔纸)，之后装水封"
    day5: "第一次定向排渣：开启锥底排渣阀，排出约200-300ml酒花沉淀与死酵母泥，见清即关"
    day6: "第二次排渣：再次开启排渣阀确认锥底无残留"
  bottling:
    kegs: 2
    keg_volume_l: 9
    sugar_per_keg_g: 80
    sugar_total_g: 160
    sugar_type: "蔗糖(白砂糖)"
    sugar_prep: "直接投放白砂糖，每桶80g，不制糖浆"
    filling: "CO2气压顶出，无氧分装，每桶约9~9.5L，顶部预留5~10%气相空间"
    o2_purge: "CO2顶入15PSI，拉安全阀放气，重复3-4次"
    spunding_valve_psi: 40
    spunding_note: "Gas In接控压阀，25°C室温拧到39~40PSI"
    secondary:
      temp: "20~28"
      duration_days: 14
      note: "2-3天糖吃干气压飙满40PSI，后续完成双乙酰和乙醛回吞还原"
    cold_crash:
      temp: "0~4"
      duration_days: "3-5"
      note: "冷藏后压力表自动跌落至18-20PSI"
    target_co2_vol: 3.0
